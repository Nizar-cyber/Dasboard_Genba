<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard Available Budget & Productivity</title>
<style>
:root{--navy:#173f67;--bg:#f4f6f9;--ink:#27323d;--mut:#5c6f82;--line:#dfe5ec}
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--ink)}
header{background:#fff;border-bottom:1px solid var(--line);padding:10px 20px;position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
header h1{font-size:17px;margin:0;color:var(--navy);margin-right:8px}
.tabs{display:flex;gap:6px}
.tab{border:1px solid var(--line);background:#fff;padding:7px 14px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600;color:var(--mut)}
.tab.active{background:var(--navy);color:#fff;border-color:var(--navy)}
.spacer{flex:1}
.btn{border:1px solid var(--line);background:#fff;padding:6px 11px;border-radius:8px;cursor:pointer;font-size:12px;color:var(--ink)}
.btn:hover{background:#eef3f8}
.btn.red{color:#b3261e}
.fy{font-size:12px;color:var(--mut)}
.fy input{width:62px;padding:4px 6px;border:1px solid var(--line);border-radius:6px}
main{padding:16px 20px 28px;max-width:1500px;margin:auto}
.title{display:flex;flex-direction:column;margin-bottom:10px}
.title h2{margin:0;font-size:22px}
.title .sub{font-size:12.5px;color:var(--mut);margin-top:2px}
.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:10px 0 14px}
.kpi{border-radius:10px;padding:9px 12px;color:#fff}
.kpi .l{font-size:10.5px;opacity:.85}
.kpi .v{font-size:19px;font-weight:700;margin-top:2px}
.kpi .s{font-size:10.5px;opacity:.85;margin-top:1px}
.grid{display:grid;grid-template-columns:1fr 1fr 330px;gap:12px;align-items:start}
.charts{grid-column:1 / span 2;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:#fff;border-radius:10px;border:1px solid var(--line);padding:10px 12px}
.card h3{margin:0 0 4px;font-size:13.5px;color:var(--navy)}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:10.5px;color:#555;margin-top:2px}
.legend i{display:inline-block;width:14px;height:9px;margin-right:4px;vertical-align:middle;border-radius:2px}
.legend i.ln{height:3px;border-radius:0}
.legend i.ds{height:0;border-top:2px dashed;background:none}
.side{display:flex;flex-direction:column;gap:10px}
.bud{background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.bud .h{color:#fff;padding:7px 11px;font-weight:700;font-size:12.5px}
.bud .b{padding:8px 11px;font-size:12px}
.bud .r{display:flex;justify-content:space-between;padding:3px 0}
.bud .r.big{font-weight:700;font-size:15px}
.bar{height:9px;background:#d9e2ea;border-radius:5px;margin-top:6px;overflow:hidden}
.bar>div{height:100%;background:#e07a2d}
.bar-t{font-size:10.5px;color:#666;margin-top:4px}
.total{background:var(--navy);color:#fff;border-radius:10px;padding:9px 12px;display:flex;justify-content:space-between;align-items:center}
.total b{font-size:18px}
.narr{background:#fff4d6;border-radius:10px;padding:10px 12px;font-size:12px;line-height:1.45}
.narr h4{margin:0 0 6px;font-size:12px;color:#8a5a00}
.narr b{color:var(--navy);display:block;margin-top:7px}
.neg{color:#c0392b!important}
.legendbox{margin-top:14px;background:#e9eef4;border-radius:10px;padding:10px 14px;font-size:11.5px;line-height:1.6}
.legendbox b{color:var(--navy)}
svg text{font-family:"Segoe UI",Arial,sans-serif}
/* input */
.tbl-wrap{overflow:auto;background:#fff;border:1px solid var(--line);border-radius:10px;margin-bottom:6px}
table.in{border-collapse:collapse;width:100%;font-size:12px;min-width:1100px}
table.in th{background:var(--navy);color:#fff;padding:7px 6px;font-weight:600;text-align:center;position:sticky;top:0}
table.in td{border-bottom:1px solid var(--line);padding:3px 4px;text-align:center}
table.in td.m{font-weight:700;background:#f1f5f9}
table.in input{width:100%;min-width:78px;border:1px solid transparent;background:#fffbe8;padding:5px 4px;text-align:right;font-size:12px;border-radius:4px}
table.in input:focus{outline:2px solid #4a90d9;background:#fff}
table.in tr.next td{background:#e8f6ee}
table.in td.calc{white-space:nowrap;min-width:100px;background:#f1f5f9;color:#173f67;font-weight:600;text-align:right;padding-right:8px}
.note{background:#fff;border:1px solid var(--line);border-left:4px solid #e0912b;border-radius:8px;padding:10px 14px;font-size:12.5px;line-height:1.55;margin-bottom:14px}
textarea.paste{width:100%;height:70px;font-size:11px;border:1px solid var(--line);border-radius:8px;padding:6px;font-family:Consolas,monospace}
.msg{font-size:12px;margin-left:8px;color:#1d7048}
h3.sec{margin:18px 0 6px;color:var(--navy)}
@media(max-width:1100px){.grid{grid-template-columns:1fr}.charts{grid-column:auto;grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,1fr)}}
@media print{
 @page{size:A4 landscape;margin:8mm}
 header,.legendbox .nop,.noprint{display:none!important}
 body{background:#fff}
 main{padding:0}
 .kpis{margin:4px 0 8px}
}
</style>
</head>
<body>
<header>
  <h1>📊 Available Budget &amp; Productivity</h1>
  <div class="tabs" id="tabs">
    <button class="tab" data-tab="non">RCI Team (Non Tango)</button>
    <button class="tab" data-tab="tan">Delivery Team (Tango)</button>
    <button class="tab" data-tab="input">✏️ Input Data</button>
  </div>
  <span class="fy">FY <input type="number" id="fy" title="Fiscal Year"></span>
  <div class="spacer"></div>
  <button class="btn" id="bPrint">🖨 Print / PDF</button>
  <button class="btn" id="bExport">⬇ Export JSON</button>
  <button class="btn" id="bImport">⬆ Import JSON</button>
  <button class="btn red" id="bReset">Reset data awal</button>
  <input type="file" id="fileIn" accept=".json" style="display:none">
</header>
<main id="view"></main>

<script>
/* ===================== DATA ===================== */
const MN=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const LS='budgetDashboard_v1';
function rep(v,n){return Array(n).fill(v)}
function mkRows(o){
  return MN.map((m,i)=>({
    mp:o.mp[i]??null, tgt:o.tgt[i]??null, vol:o.vol[i]??null,
    pf:o.pf, pv:o.pv, fix:o.fix[i]??null, vr:o.vr[i]??null,
    jam:o.jam[i]??null, prod:o.prod[i]??null
  }));
}
function defaults(){
  return {year:2026,teams:{
    non:{name:'RCI TEAM (NON TANGO)',short:'Non Tango',color:'#1f5fa6',rows:mkRows({
      mp:[...rep(32,6),...rep(30,6)],
      tgt:[...rep(3236,6),3665,3392,3392],
      vol:[2698,2664,2709,3681,3160,2727,3665,3392,3080],
      pf:282732226,pv:57045448,
      fix:[...rep(282732226,6),...rep(273815155,3)],
      vr:[15990197,35520561,65327707,35108091,28493080,10005019,34812327,24045979,81706373],
      jam:[4850.6,5173.0,5665.0,5166.2,5057.0,4751.8,4874.8,4696.9,5648.7],
      prod:[78.8,73.0,67.8,101.0,88.6,81.3,88.2,91.5,69.1]})},
    tan:{name:'DELIVERY TEAM (TANGO)',short:'Tango',color:'#00857f',rows:mkRows({
      mp:[...rep(52,10),50,50],
      tgt:[...rep(7898,7),7699,7699],
      vol:[7259,7130,5845,8393,7356,7927,10280,8992,7481],
      pf:459439868,pv:92698853,
      fix:[...rep(459439868,6),...rep(450470093,3)],
      vr:[81231255,74659269,68843723,77569233,70720534,96461075,149742098,128881657,207537701],
      jam:[8794.2,8685.7,8589.7,8733.8,8620.7,9045.6,9925.1,9580.8,10879.1],
      prod:[77.9,77.5,64.2,90.7,80.5,82.7,97.7,90.9,66.6]})}
  }};
}
let S;
function load(){try{const s=localStorage.getItem(LS);if(s){const o=JSON.parse(s);if(o&&o.teams&&o.teams.non&&o.teams.tan)return o}}catch(e){}return defaults()}
function save(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}}

/* ===================== FORMAT & CALC ===================== */
const num=x=>(x===null||x===undefined||x==='')?0:+x;
const sum=a=>a.reduce((p,c)=>p+c,0);
const idr=v=>Math.round(v).toLocaleString('id-ID');
const jt=(v,d=1)=>(v/1e6).toLocaleString('id-ID',{minimumFractionDigits:d,maximumFractionDigits:d});
const pct=v=>v.toLocaleString('id-ID',{minimumFractionDigits:1,maximumFractionDigits:1})+'%';

function calc(t){
  const R=t.rows; let last=-1;
  R.forEach((r,i)=>{if(num(r.vol)>0)last=i});
  const NA=last+1, NR=12-NA, A=R.slice(0,NA);
  const c={NA,NR,A,R};
  c.planFix=sum(R.map(r=>num(r.pf))); c.planVar=sum(R.map(r=>num(r.pv)));
  c.actFix=sum(A.map(r=>num(r.fix))); c.actVar=sum(A.map(r=>num(r.vr)));
  c.avFix=c.planFix-c.actFix; c.avVar=c.planVar-c.actVar;
  c.mFix=NR?c.avFix/NR:0; c.mVar=NR?c.avVar/NR:0;
  c.vol=A.map(r=>num(r.vol)); c.fix=A.map(r=>num(r.fix)); c.vr=A.map(r=>num(r.vr));
  c.cpu=A.map(r=>num(r.vol)>0?(num(r.fix)+num(r.vr))/num(r.vol):0);
  c.prod=A.map(r=>num(r.prod));
  c.totVol=sum(c.vol); c.totTgt=sum(A.map(r=>num(r.tgt)));
  c.totCost=c.actFix+c.actVar; c.cpuAvg=c.totVol?c.totCost/c.totVol:0;
  c.mpAvg=NA?sum(A.map(r=>num(r.mp)))/NA:0;
  const jam=A.map(r=>num(r.jam));
  c.avgProd=NA?(jam.every(j=>j>0)?sum(c.prod.map((p,i)=>p*jam[i]))/sum(jam):sum(c.prod)/NA):0;
  c.last=NA?MN[NA-1]:'-';
  c.over=A.map((r,i)=>num(r.vr)>num(r.pv)?MN[i]:null).filter(Boolean);
  const imax=a=>a.reduce((b,v,i)=>v>a[b]?i:b,0), imin=a=>a.reduce((b,v,i)=>v<a[b]?i:b,0);
  if(NA){c.iVarMax=imax(c.vr);c.iCpuMax=imax(c.cpu);c.iCpuMin=imin(c.cpu);c.iPMax=imax(c.prod);c.iPMin=imin(c.prod)}
  return c;
}

/* ===================== SVG CHARTS ===================== */
function niceMax(v){if(v<=0)return 1;const p=Math.pow(10,Math.floor(Math.log10(v))),m=v/p;
  return (m<=1?1:m<=2?2:m<=3?3:m<=4?4:m<=5?5:m<=6?6:m<=8?8:10)*p}
function hatch(id,color){return `<pattern id="${id}" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="${color}" fill-opacity=".22"/><line x1="0" y1="0" x2="0" y2="6" stroke="${color}" stroke-width="2.2"/></pattern>`}
function txt(x,y,s,o={}){
  return `<text x="${x}" y="${y}" font-size="${o.fs||9}" fill="${o.fill||'#333'}" text-anchor="${o.anchor||'middle'}" ${o.bold?'font-weight="700"':''} ${o.rot?`transform="rotate(${o.rot} ${x} ${y})"`:''} ${o.halo?'stroke="#fff" stroke-width="3" paint-order="stroke"':''}>${s}</text>`}

function barLine(o){
  const W=620,H=310,ml=48,mr=12,mt=14,mb=44,iw=W-ml-mr,ih=H-mt-mb,n=o.n,slot=iw/n,bw=slot*.64;
  const Y=v=>mt+ih*(1-v/o.ymax), X=i=>ml+slot*i+slot/2;
  let s=`<svg viewBox="0 0 ${W} ${H}" width="100%"><defs>${(o.hatches||[]).map(h=>hatch(h[0],h[1])).join('')}</defs>`;
  for(let k=0;k<=4;k++){const v=o.ymax*k/4,y=Y(v);
    s+=`<line x1="${ml}" x2="${W-mr}" y1="${y}" y2="${y}" stroke="#e6ebf0"/>`+txt(ml-5,y+3,o.tick(v),{anchor:'end',fs:8.5,fill:'#777'})}
  // bars
  o.bars.forEach((b,i)=>{ if(b.v==null)return;
    const x=X(i)-bw/2,y=Y(b.v),h=ih+mt-y;
    s+=`<rect x="${x}" y="${y}" width="${bw}" height="${Math.max(h,0)}" fill="${b.fill}" ${b.stroke?`stroke="${b.stroke}"`:''}><title>${b.tip||''}</title></rect>`;
    if(h>26)s+=txt(X(i),mt+ih-h/2,b.lbl,{rot:-90,fs:8.5,bold:1,fill:b.lc||'#fff'});
    else s+=txt(X(i),y-3,b.lbl,{fs:8.5,bold:1,fill:b.lc2||'#333'});
    if(b.top)s+=txt(X(i),y-3,b.top,{fs:8.5,bold:1,fill:b.topc||'#333',halo:1});
  });
  // plan step line
  (o.steps||[]).forEach(st=>{ if(!st.vals.length)return;
    let d='';st.vals.forEach((v,i)=>{const x0=ml+slot*i,x1=x0+slot,y=Y(v);d+=(i?`L${x0},${y}`:`M${x0},${y}`)+`L${x1},${y}`});
    s+=`<path d="${d}" fill="none" stroke="${st.color}" stroke-width="1.8" stroke-dasharray="6 4"/>`});
  // overlay line
  if(o.line&&o.line.vals.length){
    const vs=o.line.vals,mn=Math.min(...vs),mx=Math.max(...vs),rg=(mx-mn)||1,top=.04,bot=.34;
    const YL=v=>mt+ih*(top+(bot-top)*(1-(v-mn)/rg));
    s+=`<polyline fill="none" stroke="${o.line.color}" stroke-width="2.3" points="${vs.map((v,i)=>X(i)+','+YL(v)).join(' ')}"/>`;
    vs.forEach((v,i)=>{s+=`<circle cx="${X(i)}" cy="${YL(v)}" r="3" fill="${o.line.color}"><title>${o.line.tip?o.line.tip(i):''}</title></circle>`+txt(X(i),YL(v)-6,o.line.fmt(v),{fs:8,bold:1,fill:o.line.color,halo:1})});
  }
  // x labels
  for(let i=0;i<n;i++){s+=txt(X(i),H-mb+14,MN[i],{fs:9})+txt(X(i),H-mb+26,o.mp[i]??'',{fs:8.5,fill:'#8896a5'})}
  if(o.note)s+=o.note;
  return s+'</svg>';
}
function legend(items){return `<div class="legend">`+items.map(it=>`<span><i class="${it.t||''}" style="${it.t==='ds'?`border-color:${it.c}`:`background:${it.c}`}"></i>${it.x}</span>`).join('')+`</div>`}

function chartProd(c,col){
  const W=620,H=310,ml=48,mr=14,mt=14,mb=44,iw=W-ml-mr,ih=H-mt-mb,n=Math.max(c.NA,1),slot=iw/n;
  const mn=Math.min(50,Math.floor((Math.min(...c.prod)-5)/10)*10),mx=Math.max(110,Math.ceil((Math.max(...c.prod)+3)/10)*10);
  const Y=v=>mt+ih*(1-(v-mn)/(mx-mn)),X=i=>ml+slot*i+slot/2;
  let s=`<svg viewBox="0 0 ${W} ${H}" width="100%">`;
  for(let v=mn;v<=mx;v+=10){const y=Y(v);s+=`<line x1="${ml}" x2="${W-mr}" y1="${y}" y2="${y}" stroke="#e6ebf0"/>`+txt(ml-5,y+3,v+'%',{anchor:'end',fs:8.5,fill:'#777'})}
  s+=`<line x1="${ml}" x2="${W-mr}" y1="${Y(100)}" y2="${Y(100)}" stroke="#e07a2d" stroke-width="1.5" stroke-dasharray="6 4"/>`;
  s+=`<line x1="${ml}" x2="${W-mr}" y1="${Y(c.avgProd)}" y2="${Y(c.avgProd)}" stroke="#888" stroke-width="1.3" stroke-dasharray="2 3"/>`;
  const pts=c.prod.map((p,i)=>X(i)+','+Y(p));
  s+=`<polygon points="${X(0)},${Y(mn)} ${pts.join(' ')} ${X(c.prod.length-1)},${Y(mn)}" fill="${col}" fill-opacity=".12"/>`;
  s+=`<polyline fill="none" stroke="${col}" stroke-width="2.4" points="${pts.join(' ')}"/>`;
  c.prod.forEach((p,i)=>{s+=`<circle cx="${X(i)}" cy="${Y(p)}" r="3.2" fill="${col}"/>`+txt(X(i),Y(p)-7,pct(p),{fs:8.5,bold:1,fill:col,halo:1})});
  for(let i=0;i<c.NA;i++)s+=txt(X(i),H-mb+14,MN[i],{fs:9})+txt(X(i),H-mb+26,c.A[i].mp??'',{fs:8.5,fill:'#8896a5'});
  return s+'</svg>';
}

/* ===================== NARRATIVE ===================== */
function narr(c,t){
  if(!c.NA)return [['Belum ada data actual','Isi Act Volume, Act Fix, Act Var dan Productivity pada tab ✏️ Input Data.']];
  const lastFix=c.fix[c.NA-1], pfAvg=c.planFix/12, pvAvg=c.planVar/12;
  const rest=c.NR?`dibagi rata ${MN[c.NA]}–Des = Rp${jt(c.mFix,1)} jt/bln`:'(seluruh bulan sudah actual)';
  const restV=c.NR?`dibagi rata ${MN[c.NA]}–Des = Rp${jt(c.mVar,1)} jt/bln (plan Rp${jt(pvAvg,1)} jt/bln)`:'(seluruh bulan sudah actual)';
  const stF=c.avFix<0?`<span class="neg">OVER budget Rp${jt(-c.avFix,0)} jt</span>`:`Sisa Rp${jt(c.avFix,0)} jt`;
  const stV=c.avVar<0?`<span class="neg">OVER budget Rp${jt(-c.avVar,0)} jt</span>`:`Sisa Rp${jt(c.avVar,0)} jt`;
  const ov=c.over.length?`Di atas plan bulanan: ${c.over.join(', ')}; `:'Belum ada bulan di atas plan bulanan; ';
  return [
   ['1. Fix cost (biaya tetap)',`Plan Rp${jt(pfAvg,0)} jt/bln. Actual Jan–${c.last} Rp${jt(c.actFix,0)} jt (${pct(c.actFix/c.planFix*100)} plan; waktu berjalan ${pct(c.NA/12*100)}), terakhir Rp${jt(lastFix,0)} jt/bln. ${stF} ${rest}.`],
   ['2. Var cost (lembur / OT)',`Terpakai Rp${jt(c.actVar,0)} jt (${pct(c.actVar/c.planVar*100)} plan). ${stV} ${restV}. ${ov}${c.last} Rp${jt(c.vr[c.NA-1],1)} jt, tertinggi ${MN[c.iVarMax]} Rp${jt(c.vr[c.iVarMax],1)} jt.`],
   ['3. Cost per unit & productivity',`Cost/unit tertinggi ${MN[c.iCpuMax]} Rp${idr(c.cpu[c.iCpuMax])} (prod. ${pct(c.prod[c.iCpuMax])}), terendah ${MN[c.iCpuMin]} Rp${idr(c.cpu[c.iCpuMin])}. Productivity tertinggi ${MN[c.iPMax]} ${pct(c.prod[c.iPMax])}, terendah ${MN[c.iPMin]} ${pct(c.prod[c.iPMin])}; rata-rata ${pct(c.avgProd)}. Bulan terakhir (${c.last}): ${pct(c.prod[c.NA-1])}, cost/unit Rp${idr(c.cpu[c.NA-1])}.`]
  ];
}

/* ===================== DASHBOARD VIEW ===================== */
function dash(key){
  const t=S.teams[key],c=calc(t),col=t.color,R=c.R,NA=c.NA,NR=c.NR;
  const range=NA?`Actual Jan–${c.last}`:'Belum ada actual';
  const restTxt=NR&&NA?`Sisa budget dibagi rata ${MN[NA]}–Des`:'';
  const kp=[
    ['MP (rata-rata)',c.mpAvg.toLocaleString('id-ID',{maximumFractionDigits:1}),'Man Power'],
    ['Act. Volume',idr(c.totVol)+' unit',c.totTgt?`${pct(c.totVol/c.totTgt*100)} dari target ${idr(c.totTgt)}`:''],
    ['Total Cost Actual','Rp '+jt(c.totCost/1e3,2).replace(/,00$/,'')+' M','Fix + Var'],
    ['Cost / Unit (avg)','Rp '+idr(c.cpuAvg),'Total cost ÷ volume'],
    ['Productivity Adj. (OT)',pct(c.avgProd),'rata-rata'],
    ['Total Available','Rp '+jt(c.avFix+c.avVar,1)+' jt','Fix + Var']
  ];
  const kcol=[col,col,col,col,col,'#173f67'];
  // chart 1
  const pfSteps=R.map(r=>num(r.pf)/1e6), pvSteps=R.map(r=>num(r.pv)/1e6);
  const hid=key+'h';
  const fixBars=R.map((r,i)=>i<NA?{v:num(r.fix)/1e6,fill:col,lbl:(num(r.fix)/1e6).toFixed(0),tip:`${MN[i]} Act Fix Rp ${idr(num(r.fix))}`}
    :(NR?{v:c.mFix/1e6,fill:`url(#${hid}1)`,stroke:col,lbl:(c.mFix/1e6).toFixed(0),lc:'#173f67',tip:`${MN[i]} Available Fix Rp ${idr(c.mFix)}`}:{v:null}));
  const y1=niceMax(Math.max(...pfSteps,...fixBars.map(b=>b.v||0))*1.9);
  const ch1=barLine({n:12,ymax:y1,tick:v=>Math.round(v),bars:fixBars,steps:[{vals:pfSteps,color:'#e07a2d'}],
    line:NA?{vals:c.vol,color:'#c0392b',fmt:idr,tip:i=>`${MN[i]} Volume ${idr(c.vol[i])}`}:null,
    mp:R.map(r=>r.mp),hatches:[[hid+'1',col]]});
  // chart 2
  const hid2=key+'v';
  const varBars=R.map((r,i)=>i<NA?{v:num(r.vr)/1e6,fill:'#e0912b',lbl:'',top:(num(r.vr)/1e6).toLocaleString('id-ID',{minimumFractionDigits:1,maximumFractionDigits:1}),topc:num(r.vr)>num(r.pv)?'#c0392b':'#8a5400',tip:`${MN[i]} Act Var Rp ${idr(num(r.vr))}`}
    :(NR?{v:Math.max(c.mVar,0)/1e6,fill:`url(#${hid2}1)`,stroke:'#2e9e6a',lbl:'',top:(c.mVar/1e6).toLocaleString('id-ID',{minimumFractionDigits:1,maximumFractionDigits:1}),topc:c.mVar<0?'#c0392b':'#1d7048',tip:`${MN[i]} Available Var Rp ${idr(c.mVar)}`}:{v:null}));
  const y2=niceMax(Math.max(...pvSteps,...varBars.map(b=>b.v||0))*1.9);
  const ch2=barLine({n:12,ymax:y2,tick:v=>Math.round(v),bars:varBars,steps:[{vals:pvSteps,color:'#c0392b'}],
    line:NA?{vals:c.vol,color:'#c0392b',fmt:idr}:null,mp:R.map(r=>r.mp),hatches:[[hid2+'1','#2e9e6a']]});
  // chart 3
  const n3=Math.max(NA,1);
  const volBars=c.vol.map((v,i)=>({v,fill:'#c9d8e8',stroke:'#7d97b3',lbl:idr(v),lc:'#173f67',tip:`${MN[i]} Volume ${idr(v)}`}));
  const ch3=NA?barLine({n:n3,ymax:niceMax(Math.max(...c.vol)*2),tick:v=>Math.round(v).toLocaleString('id-ID'),bars:volBars,
    line:{vals:c.cpu,color:col,fmt:idr,tip:i=>`${MN[i]} Cost/unit Rp ${idr(c.cpu[i])}`},mp:c.A.map(r=>r.mp)}):'';
  const ch4=NA?chartProd(c,col):'';
  const nr=narr(c,t);
  const cls=v=>v<0?'neg':'';
  const barPct=(u,p)=>Math.max(0,Math.min(100,p?u/p*100:0));
  return `
  <div class="title"><h2 style="color:${col}">AVAILABLE BUDGET &amp; PRODUCTIVITY REVIEW | ${t.name}</h2>
  <div class="sub">Plan vs Actual Fix &amp; Var Cost FY ${S.year} (Jan–Dec) • ${range}${restTxt?' • '+restTxt:''} • Rp juta</div></div>
  <div class="kpis">${kp.map((k,i)=>`<div class="kpi" style="background:${kcol[i]}"><div class="l">${k[0]}</div><div class="v">${k[1]}</div><div class="s">${k[2]}</div></div>`).join('')}</div>
  <div class="grid">
   <div class="charts">
    <div class="card"><h3>① Fix Cost: Plan vs Actual vs Volume</h3>${ch1}
      ${legend([{c:col,x:'Act. Fix (Actual Fix Cost)'},{c:col,t:'',x:'Available/bln (sisa budget per bulan)'},{c:'#e07a2d',t:'ds',x:'Plan Fix (rencana Fix Cost)'},{c:'#c0392b',t:'ln',x:'Act. Volume (volume aktual, unit)'}])}</div>
    <div class="card"><h3>② Var Cost (OT): Plan vs Actual vs Volume</h3>${ch2}
      ${legend([{c:'#e0912b',x:'Act. Var (Actual Var Cost)'},{c:'#2e9e6a',x:'Available/bln (sisa budget per bulan)'},{c:'#c0392b',t:'ds',x:'Plan Var (rencana Var Cost)'},{c:'#c0392b',t:'ln',x:'Act. Volume (unit)'}])}</div>
    <div class="card"><h3>③ Cost per Unit vs Volume</h3>${ch3||'<p>Belum ada data.</p>'}
      ${legend([{c:'#c9d8e8',x:'Act. Volume (volume aktual)'},{c:col,t:'ln',x:'Cost / Unit (biaya per unit, Rp) = (Act Fix + Act Var) ÷ Volume'}])}</div>
    <div class="card"><h3>④ Productivity Adjusted (OT)</h3>${ch4||'<p>Belum ada data.</p>'}
      ${legend([{c:col,t:'ln',x:'Productivity Adj. (OT = Overtime)'},{c:'#e07a2d',t:'ds',x:'100%'},{c:'#888',t:'ds',x:'Rata-rata (average) '+pct(c.avgProd)}])}</div>
   </div>
   <div class="side">
    <div class="bud"><div class="h" style="background:${col}">FIX COST (biaya tetap)</div><div class="b">
      <div class="r"><span>Plan FY (Fiscal Year)</span><span>Rp ${jt(c.planFix)} jt</span></div>
      <div class="r"><span>Actual ${NA?'Jan–'+c.last:'-'}</span><span>Rp ${jt(c.actFix)} jt</span></div>
      <div class="r big" style="color:${col}"><span>Available Fix</span><span class="${cls(c.avFix)}">Rp ${jt(c.avFix)} jt</span></div>
      <div class="r"><span>${NR?`Per bln (${MN[NA]}–Des ÷${NR})`:'Per bln'}</span><span class="${cls(c.mFix)}">Rp ${jt(c.mFix)} jt</span></div>
      <div class="bar"><div style="width:${barPct(c.actFix,c.planFix)}%"></div></div>
      <div class="bar-t">Terpakai ${pct(c.actFix/c.planFix*100)} | Sisa ${pct(100-c.actFix/c.planFix*100)}</div></div></div>
    <div class="bud"><div class="h" style="background:#c26a12">VAR COST (Variable Cost / lembur)</div><div class="b">
      <div class="r"><span>Plan FY (Fiscal Year)</span><span>Rp ${jt(c.planVar)} jt</span></div>
      <div class="r"><span>Actual ${NA?'Jan–'+c.last:'-'}</span><span>Rp ${jt(c.actVar)} jt</span></div>
      <div class="r big" style="color:#c26a12"><span>Available Var</span><span class="${cls(c.avVar)}">Rp ${jt(c.avVar)} jt</span></div>
      <div class="r"><span>${NR?`Per bln (${MN[NA]}–Des ÷${NR})`:'Per bln'}</span><span class="${cls(c.mVar)}">Rp ${jt(c.mVar)} jt</span></div>
      <div class="bar"><div style="width:${barPct(c.actVar,c.planVar)}%"></div></div>
      <div class="bar-t">Terpakai ${pct(c.actVar/c.planVar*100)} | Sisa ${pct(100-c.actVar/c.planVar*100)}</div></div></div>
    <div class="total"><span style="font-size:12px">TOTAL AVAILABLE (Fix + Var)</span><b class="${cls(c.avFix+c.avVar)}">Rp ${jt(c.avFix+c.avVar)} jt</b></div>
    <div class="narr"><h4>NARASI UTAMA</h4>${nr.map(n=>`<b>${n[0]}</b>${n[1]}`).join('')}</div>
   </div>
  </div>
  <div class="legendbox"><b>KETERANGAN SINGKATAN</b><br>
   FY = Fiscal Year (tahun anggaran Jan–Des) • Fix = Fix Cost (biaya tetap) • Var = Variable Cost (biaya variabel / lembur) • OT = Overtime (lembur) • MP = Man Power (jumlah tenaga kerja) • Act. = Actual (realisasi) • Plan = rencana budget • Available = sisa budget (Plan FY − Actual) • Productivity Adj. (OT) = produktivitas yang disesuaikan jam lembur • jt = juta • M = miliar • rb = ribu • bln = bulan • Angka di bawah bulan pada grafik = jumlah MP.<br>
   <span style="color:#5c6f82">Available per bulan = (Plan FY − Actual s/d bulan terakhir) ÷ jumlah bulan tersisa. Cost/unit = (Act Fix + Act Var) ÷ Act Volume.</span></div>`;
}

/* ===================== INPUT VIEW ===================== */
const FIELDS=[['mp','MP','Man Power'],['tgt','Target Vol/bln','by Forecast'],['vol','Act. Volume','unit'],['pf','Plan Fix Cost','Rp'],['fix','Act. Fix Cost','Rp'],['pv','Plan Var Cost','Rp'],['vr','Act. Var Cost','Rp'],['jam','Total Jam Kerja','Fix+OT (opsional)'],['prod','Productivity Adj. (OT)','% (mis. 78,8)']];
function inputTable(key){
  const t=S.teams[key],c=calc(t);
  let h=`<h3 class="sec" style="color:${t.color}">${t.name}</h3><div class="tbl-wrap"><table class="in" data-team="${key}"><thead><tr><th>Bulan</th>${FIELDS.map(f=>`<th>${f[1]}<br><small style="font-weight:400">${f[2]}</small></th>`).join('')}<th>Cost / Unit<br><small style="font-weight:400">otomatis</small></th></tr></thead><tbody>`;
  t.rows.forEach((r,i)=>{
    const next=(i===c.NA)?' class="next"':'';
    h+=`<tr${next}><td class="m">${MN[i]}</td>${FIELDS.map(f=>`<td><input type="number" step="any" data-t="${key}" data-i="${i}" data-f="${f[0]}" value="${r[f[0]]??''}"></td>`).join('')}<td class="calc" id="cpu_${key}_${i}">${cpuTxt(r)}</td></tr>`;
  });
  return h+`</tbody></table></div>
  <div class="noprint"><textarea class="paste" id="paste_${key}" placeholder="Atau paste langsung baris tabel dari Excel (kolom: Bulan, MP, Target Vol, Act Volume, Plan Fix, Act Fix, Plan Var, Act Var, CT Standar, Jam Kerja Fix, Jam OT, Total Jam, CT Aktual, Cost/Unit, Target Efektif, Productivity) lalu klik Terapkan"></textarea>
  <button class="btn" data-paste="${key}">Terapkan paste Excel</button><span class="msg" id="msg_${key}"></span></div>`;
}
function cpuTxt(r){const v=num(r.vol);return v>0?'Rp '+idr((num(r.fix)+num(r.vr))/v):'-'}
function inputView(){
  const c1=calc(S.teams.non),c2=calc(S.teams.tan);
  return `<div class="title"><h2 style="color:#173f67">Input Data Bulanan</h2><div class="sub">Data tersimpan otomatis di browser ini (localStorage). Gunakan Export JSON untuk backup / pindah PC.</div></div>
  <div class="note"><b>Cara update bulan berikutnya:</b><br>
   1) Isi baris bulan yang hijau (bulan berikutnya): <b>Act. Volume, Act. Fix Cost, Act. Var Cost, Productivity Adj. (OT)</b> (+ Total Jam Kerja bila ada) untuk Non Tango dan Tango.<br>
   2) Kalau MP, Target Vol, atau Plan berubah, edit di baris bulan yang bersangkutan.<br>
   3) Buka tab dashboard — grafik, sisa budget, dan narasi otomatis menghitung ulang (sisa budget dibagi rata ke bulan yang belum actual).<br>
   Bulan dianggap <i>sudah actual</i> jika kolom Act. Volume terisi. Cost/Unit dihitung otomatis.</div>
  ${inputTable('non')}${inputTable('tan')}`;
}

/* ===================== PASTE PARSER ===================== */
function parseNum(s){
  if(s==null)return null;
  s=String(s).replace(/Rp|IDR|%|\s/gi,'');
  if(s===''||s==='-')return null;
  if(s.includes('.')&&s.includes(','))s=s.replace(/\./g,'').replace(',','.');
  else if(s.includes(','))s=s.replace(',','.');
  else if(/^\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,'');
  const v=parseFloat(s);return isNaN(v)?null:v;
}
function applyPaste(key){
  const ta=document.getElementById('paste_'+key),msg=document.getElementById('msg_'+key);
  const lines=ta.value.split(/\r?\n/).filter(l=>l.trim());let n=0;
  lines.forEach(l=>{
    const c=l.split('\t'),mi=MN.findIndex(m=>m.toLowerCase()===c[0].trim().toLowerCase().slice(0,3));
    if(mi<0)return;
    const r=S.teams[key].rows[mi],g=k=>parseNum(c[k]);
    const map={mp:1,tgt:2,vol:3,pf:4,fix:5,pv:6,vr:7,jam:11,prod:15};
    for(const f in map){const v=g(map[f]);if(v!==null)r[f]=v;else if(['vol','fix','vr','jam','prod'].includes(f))r[f]=null}
    n++;
  });
  save();msg.textContent=n?`✔ ${n} baris diterapkan`:'Tidak ada baris yang cocok (pastikan kolom pertama = Jan, Feb, ...)';
  if(n){ta.value='';render()}
}

/* ===================== APP ===================== */
let TAB=(localStorage.getItem('budgetTab')||'non');
function render(){
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===TAB));
  const v=document.getElementById('view');
  v.innerHTML=TAB==='input'?inputView():dash(TAB);
  document.getElementById('fy').value=S.year;
}
document.getElementById('tabs').addEventListener('click',e=>{const b=e.target.closest('.tab');if(!b)return;TAB=b.dataset.tab;try{localStorage.setItem('budgetTab',TAB)}catch(_){}render();window.scrollTo(0,0)});
document.getElementById('view').addEventListener('change',e=>{
  const el=e.target;if(!el.dataset||!el.dataset.f)return;
  const r=S.teams[el.dataset.t].rows[+el.dataset.i];
  r[el.dataset.f]=el.value===''?null:parseFloat(el.value);
  save();document.getElementById(`cpu_${el.dataset.t}_${el.dataset.i}`).textContent=cpuTxt(r);
});
document.getElementById('view').addEventListener('click',e=>{const b=e.target.closest('[data-paste]');if(b)applyPaste(b.dataset.paste)});
document.getElementById('fy').addEventListener('change',e=>{S.year=+e.target.value||S.year;save();render()});
document.getElementById('bPrint').onclick=()=>{if(TAB==='input'){TAB='non';render()}window.print()};
document.getElementById('bExport').onclick=()=>{
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,1)],{type:'application/json'}));
  a.download=`budget_dashboard_data_${new Date().toISOString().slice(0,10)}.json`;a.click();
};
document.getElementById('bImport').onclick=()=>document.getElementById('fileIn').click();
document.getElementById('fileIn').addEventListener('change',e=>{
  const f=e.target.files[0];if(!f)return;const fr=new FileReader();
  fr.onload=()=>{try{const o=JSON.parse(fr.result);if(!o.teams||!o.teams.non||!o.teams.tan)throw 0;S=o;save();render();alert('Import berhasil')}catch(_){alert('File JSON tidak valid')}};
  fr.readAsText(f);e.target.value='';
});
document.getElementById('bReset').onclick=()=>{if(confirm('Kembalikan semua data ke data awal (Jan–Sep)? Data input akan terhapus.')){S=defaults();save();render()}};
S=load();render();
</script>
</body>
