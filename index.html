<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monitoring Hub — Dashboard Center</title>
<style>
:root{
  --red:#EB0A1E; --red-dark:#B00812; --blue:#0066B1; --blue-light:#00A1DE;
  --dark:#1a1a2e; --grey:#6b7280; --light:#f4f6fb; --white:#fff;
  --transition:all .2s ease;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;}
body{font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;background:var(--light);color:var(--dark);overflow:hidden;}

/* ===== APP LAYOUT ===== */
.app{display:flex;height:100vh;position:relative;}

/* ===== SIDEBAR (FLOATING + AUTO-HIDE) ===== */
.sidebar{
  position:fixed;top:0;left:0;height:100vh;
  width:300px;min-width:300px;
  background:rgba(255,255,255,.92);backdrop-filter:blur(8px);
  border-right:1px solid #e6e9f0;display:flex;flex-direction:column;
  box-shadow:3px 0 24px rgba(0,0,0,.14);z-index:120;
  transform:translateX(0);
  transition:transform .32s cubic-bezier(.4,0,.2,1);
}
.sidebar.hidden{transform:translateX(-100%);}
/* zona pemicu di tepi kiri untuk memunculkan menu lagi */
.edge-trigger{position:fixed;top:0;left:0;width:14px;height:100vh;z-index:115;}
/* tab kecil penanda "tarik menu" saat sidebar tersembunyi */
.edge-handle{
  position:fixed;top:50%;left:0;transform:translateY(-50%);
  width:26px;height:70px;background:var(--blue);color:#fff;
  border-radius:0 12px 12px 0;display:flex;align-items:center;justify-content:center;
  font-size:1.1em;cursor:pointer;z-index:116;box-shadow:2px 2px 10px rgba(0,0,0,.2);
  opacity:0;pointer-events:none;transition:opacity .3s ease;
}
.edge-handle.show{opacity:.85;pointer-events:auto;}
.edge-handle:hover{opacity:1;}
/* tombol pin untuk mengunci menu tetap terbuka */
.pin-btn{position:absolute;top:14px;right:12px;width:30px;height:30px;border:none;border-radius:8px;
  background:rgba(255,255,255,.25);color:#fff;cursor:pointer;font-size:.95em;display:flex;align-items:center;justify-content:center;transition:var(--transition);z-index:5;}
.pin-btn:hover{background:rgba(255,255,255,.4);}
.pin-btn.pinned{background:#FFD700;color:var(--dark);}
.sb-head{
  background:linear-gradient(135deg,var(--blue) 0%,#004a80 60%,var(--dark) 100%);
  color:#fff;padding:20px 18px;
}
.sb-head .top{display:flex;align-items:center;gap:11px;}
.sb-head .logo{width:44px;height:44px;background:#fff;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:1.5em;flex-shrink:0;box-shadow:0 2px 8px rgba(0,0,0,.2);}
.sb-head h1{font-size:1.15em;font-weight:800;line-height:1.1;}
.sb-head p{font-size:.75em;opacity:.85;margin-top:2px;}
.sb-stats{display:flex;gap:8px;margin-top:14px;}
.sb-stats .st{flex:1;background:rgba(255,255,255,.14);border-radius:9px;padding:8px 6px;text-align:center;}
.sb-stats .st .n{font-size:1.3em;font-weight:800;line-height:1;}
.sb-stats .st .l{font-size:.62em;opacity:.85;text-transform:uppercase;letter-spacing:.5px;margin-top:3px;}

.sb-tools{padding:12px 14px;border-bottom:1px solid #eef1f6;}
.sb-search{position:relative;margin-bottom:10px;}
.sb-search input{width:100%;padding:10px 12px 10px 36px;border:2px solid #e2e6ee;border-radius:10px;font-size:.9em;transition:var(--transition);}
.sb-search input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(0,102,177,.1);}
.sb-search .ico{position:absolute;left:12px;top:50%;transform:translateY(-50%);opacity:.5;}
.sb-btns{display:flex;gap:7px;}
.btn{padding:9px 12px;border:none;border-radius:9px;font-size:.82em;font-weight:700;cursor:pointer;transition:var(--transition);display:inline-flex;align-items:center;justify-content:center;gap:5px;}
.btn:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(0,0,0,.13);}
.btn-blue{background:var(--blue);color:#fff;}
.btn-red{background:var(--red);color:#fff;}
.btn-outline{background:#fff;color:var(--dark);border:2px solid #e2e6ee;}
.sb-btns .btn{flex:1;}

/* nav list */
.sb-list{flex:1;overflow-y:auto;padding:10px 10px 20px;}
.cat-group{margin-bottom:6px;}
.cat-label{font-size:.68em;font-weight:800;text-transform:uppercase;letter-spacing:1px;color:var(--grey);padding:12px 10px 6px;}
.nav-item{
  display:flex;align-items:center;gap:11px;padding:10px 11px;border-radius:11px;cursor:pointer;
  transition:var(--transition);border-left:4px solid transparent;margin-bottom:3px;position:relative;
}
.nav-item:hover{background:#f2f5fb;}
.nav-item.active{background:var(--accent-soft,#e6f0fa);border-left-color:var(--accent,var(--blue));}
.nav-item .ni-icon{width:38px;height:38px;border-radius:10px;background:var(--accent-soft,#e6f0fa);display:flex;align-items:center;justify-content:center;font-size:1.3em;flex-shrink:0;}
.nav-item .ni-txt{flex:1;min-width:0;}
.nav-item .ni-name{font-size:.92em;font-weight:700;color:var(--dark);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.nav-item .ni-cat{font-size:.72em;color:var(--grey);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.nav-item .ni-actions{display:flex;gap:4px;opacity:0;transition:var(--transition);}
.nav-item:hover .ni-actions{opacity:1;}
.mini-btn{width:26px;height:26px;border:none;border-radius:7px;cursor:pointer;font-size:.8em;display:flex;align-items:center;justify-content:center;background:#e8ecf4;transition:var(--transition);}
.mini-btn:hover{background:#d5dbe8;}
.mini-btn.del:hover{background:#fbdcdc;}
.sb-empty{text-align:center;color:var(--grey);padding:40px 16px;font-size:.85em;}

/* ===== MAIN PREVIEW ===== */
.main{flex:1;display:flex;flex-direction:column;min-width:0;width:100%;}
.preview-bar{
  background:#fff;border-bottom:1px solid #e6e9f0;padding:12px 20px;
  display:flex;align-items:center;gap:12px;box-shadow:0 2px 8px rgba(0,0,0,.04);
}
.preview-bar .pv-icon{width:40px;height:40px;border-radius:10px;background:var(--accent-soft,#e6f0fa);display:flex;align-items:center;justify-content:center;font-size:1.35em;flex-shrink:0;}
.preview-bar .pv-info{flex:1;min-width:0;}
.preview-bar .pv-name{font-size:1.08em;font-weight:800;color:var(--dark);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.preview-bar .pv-url{font-size:.78em;color:var(--grey);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.preview-frame-wrap{flex:1;position:relative;background:#eef1f6;}
.preview-frame-wrap iframe{width:100%;height:100%;border:none;background:#fff;}

/* welcome / empty preview */
.pv-welcome{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:var(--grey);padding:30px;}
.pv-welcome .big{font-size:4.5em;margin-bottom:16px;}
.pv-welcome h2{font-size:1.5em;color:var(--dark);margin-bottom:8px;}
.pv-welcome p{max-width:420px;line-height:1.6;}

/* ===== MODAL (SCROLLABLE FIX) ===== */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(20,20,40,.55);z-index:200;
  align-items:flex-start;justify-content:center;padding:24px 20px;backdrop-filter:blur(3px);overflow-y:auto;}
.modal-bg.show{display:flex;}
.modal{background:#fff;border-radius:18px;padding:26px;width:100%;max-width:480px;
  box-shadow:0 20px 60px rgba(0,0,0,.3);animation:pop .25s ease;
  max-height:calc(100vh - 48px);overflow-y:auto;margin:auto;}
@keyframes pop{from{opacity:0;transform:scale(.95) translateY(10px);}to{opacity:1;transform:scale(1) translateY(0);}}
.modal h2{font-size:1.3em;margin-bottom:16px;color:var(--dark);}
.modal label{display:block;font-size:.83em;font-weight:700;color:var(--dark);margin:13px 0 6px;}
.modal input,.modal textarea{width:100%;padding:11px 13px;border:2px solid #e2e6ee;border-radius:10px;font-size:.94em;font-family:inherit;transition:var(--transition);}
.modal input:focus,.modal textarea:focus{outline:none;border-color:var(--blue);}
.modal textarea{resize:vertical;min-height:58px;}
.icon-picker{display:flex;gap:7px;flex-wrap:wrap;margin-top:6px;}
.icon-opt{width:40px;height:40px;border:2px solid #e2e6ee;border-radius:10px;font-size:1.25em;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:var(--transition);}
.icon-opt:hover{border-color:var(--blue);}
.icon-opt.sel{border-color:var(--blue);background:#e6f0fa;}
.color-picker{display:flex;gap:10px;margin-top:6px;}
.color-opt{width:32px;height:32px;border-radius:50%;cursor:pointer;border:3px solid transparent;transition:var(--transition);}
.color-opt.sel{border-color:var(--dark);transform:scale(1.12);}
/* sticky footer buttons so Save is ALWAYS visible */
.modal-btns{display:flex;gap:10px;margin-top:22px;position:sticky;bottom:-26px;background:#fff;padding:14px 0 2px;border-top:1px solid #f0f2f7;}
.modal-btns .btn{flex:1;padding:12px;font-size:.92em;}

@media(max-width:820px){
  .sidebar{width:85%;max-width:320px;}
  .main{min-height:100vh;}
  .edge-handle{width:32px;height:80px;opacity:.9;}
}
</style>
</head>
<body>

<div class="app">

  <!-- zona pemicu tepi kiri + handle -->
  <div class="edge-trigger" onmouseenter="showSidebar()"></div>
  <div class="edge-handle" id="edgeHandle" onclick="showSidebar()" title="Buka menu">☰</div>

  <!-- ===== SIDEBAR ===== -->
  <aside class="sidebar" id="sidebar" onmouseleave="onSidebarLeave()">
    <div class="sb-head">
      <button class="pin-btn" id="pinBtn" onclick="togglePin()" title="Kunci menu tetap terbuka">📌</button>
      <div class="top">
        <div class="logo">🖥️</div>
        <div>
          <h1>Monitoring Hub</h1>
          <p>Pusat Kendali Dashboard</p>
        </div>
      </div>
      <div class="sb-stats">
        <div class="st"><div class="n" id="statTotal">0</div><div class="l">Dashboard</div></div>
        <div class="st"><div class="n" id="statCat">0</div><div class="l">Kategori</div></div>
      </div>
    </div>

    <div class="sb-tools">
      <div class="sb-search">
        <span class="ico">🔍</span>
        <input type="text" id="searchBox" placeholder="Cari dashboard..." oninput="renderList()">
      </div>
      <div class="sb-btns">
        <button class="btn btn-red" onclick="openModal()">＋ Tambah</button>
        <button class="btn btn-outline" onclick="exportConfig()" title="Backup daftar">⬇</button>
        <button class="btn btn-outline" onclick="document.getElementById('importFile').click()" title="Restore daftar">⬆</button>
        <input type="file" id="importFile" accept=".json" style="display:none" onchange="importConfig(this)">
      </div>
    </div>

    <div class="sb-list" id="navList"></div>
  </aside>

  <!-- ===== MAIN PREVIEW ===== -->
  <div class="main">
    <div class="preview-bar" id="previewBar" style="display:none;">
      <div class="pv-icon" id="pvIcon">📊</div>
      <div class="pv-info">
        <div class="pv-name" id="pvName">—</div>
        <div class="pv-url" id="pvUrl">—</div>
      </div>
      <button class="btn btn-outline" onclick="reloadPreview()" title="Muat ulang preview">🔄</button>
      <button class="btn btn-blue" onclick="openFull()">↗ Buka Tab Baru</button>
    </div>
    <div class="preview-frame-wrap">
      <iframe id="previewFrame" src="about:blank" style="display:none;"></iframe>
      <div class="pv-welcome" id="pvWelcome">
        <div class="big">👈</div>
        <h2>Pilih Dashboard</h2>
        <p>Klik salah satu dashboard di menu sebelah kiri untuk menampilkan preview-nya di sini. Kamu juga bisa menambah dashboard baru dengan tombol <b>＋ Tambah</b>.</p>
      </div>
    </div>
  </div>

</div>

<!-- ===== MODAL ===== -->
<div class="modal-bg" id="modalBg">
  <div class="modal">
    <h2 id="modalTitle">Tambah Dashboard</h2>
    <input type="hidden" id="editId">
    <label>Nama Dashboard *</label>
    <input type="text" id="fName" placeholder="Contoh: Dashboard Genba Management">
    <label>Link / URL *</label>
    <input type="text" id="fUrl" placeholder="https://nizar-cyber.github.io/Dasboard_Genba/">
    <label>Deskripsi Singkat</label>
    <textarea id="fDesc" placeholder="Contoh: Timeline, materi genba & summary achievement per area."></textarea>
    <label>Kategori</label>
    <input type="text" id="fCat" placeholder="Contoh: Genba, Logistik, QC" list="catList">
    <datalist id="catList"></datalist>
    <label>Ikon</label>
    <div class="icon-picker" id="iconPicker"></div>
    <label>Warna Aksen</label>
    <div class="color-picker" id="colorPicker"></div>
    <div class="modal-btns">
      <button class="btn btn-outline" onclick="closeModal()">Batal</button>
      <button class="btn btn-blue" onclick="saveCard()">💾 Simpan</button>
    </div>
  </div>
</div>

<script>
// ============ DATA ============
const ICONS = ['📊','📈','📉','🗂️','📋','🚗','🏭','📦','🔧','⚙️','🛠️','📍','🗺️','🎯','⏱️','💹','🧭','🔍','🖥️','📅'];
const COLORS = [
  {c:'#0066B1',s:'#e6f0fa'}, {c:'#EB0A1E',s:'#fde5e7'}, {c:'#28A745',s:'#e4f5ea'},
  {c:'#E67E22',s:'#fcefe1'}, {c:'#6F42C1',s:'#efe8fa'}, {c:'#17A2B8',s:'#e1f4f7'}
];
function getDefault(){
  return [
    { id:uid(), name:'Dashboard Genba Management CCY', url:'https://nizar-cyber.github.io/Dasboard_Genba/',
      desc:'Timeline & Gantt, Materi Genba per bulan, dan Summary Achievement per area (PIO, Del, RCI, Kaizen, RTCO).',
      cat:'Genba', icon:'📊', color:'#0066B1', soft:'#e6f0fa' }
  ];
}
function uid(){ return 'd'+Date.now()+Math.floor(Math.random()*1000); }

let cards = JSON.parse(localStorage.getItem('hub_cards')||'null') || getDefault();
let activeId = null;
let selIcon = ICONS[0];
let selColor = COLORS[0];

function persist(){ localStorage.setItem('hub_cards', JSON.stringify(cards)); }
function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

// ============ SIDEBAR LIST ============
function getCats(){
  let set=new Set(); cards.forEach(c=>{ if(c.cat&&c.cat.trim()) set.add(c.cat.trim()); });
  return Array.from(set).sort();
}
function renderList(){
  let q=(document.getElementById('searchBox').value||'').toLowerCase();
  let list=cards.filter(c=> !q || (c.name+' '+c.desc+' '+c.cat).toLowerCase().includes(q));
  let el=document.getElementById('navList');

  if(!cards.length){ el.innerHTML='<div class="sb-empty">📭<br><br>Belum ada dashboard.<br>Klik <b>＋ Tambah</b> untuk mulai.</div>'; updateStats(); return; }
  if(!list.length){ el.innerHTML='<div class="sb-empty">🔍<br><br>Tidak ada hasil untuk "<b>'+esc(q)+'</b>".</div>'; updateStats(); return; }

  // group by category
  let groups={}; let noCat=[];
  list.forEach(c=>{ if(c.cat&&c.cat.trim()){ (groups[c.cat.trim()]=groups[c.cat.trim()]||[]).push(c); } else noCat.push(c); });
  let cats=Object.keys(groups).sort();

  let html='';
  cats.forEach(cat=>{
    html+='<div class="cat-group"><div class="cat-label">'+esc(cat)+'</div>';
    groups[cat].forEach(c=>{ html+=itemHtml(c); });
    html+='</div>';
  });
  if(noCat.length){
    html+='<div class="cat-group"><div class="cat-label">Lainnya</div>';
    noCat.forEach(c=>{ html+=itemHtml(c); });
    html+='</div>';
  }
  el.innerHTML=html;
  updateStats();
}
function itemHtml(c){
  let act=(c.id===activeId)?' active':'';
  let h='<div class="nav-item'+act+'" style="--accent:'+c.color+';--accent-soft:'+(c.soft||'#e6f0fa')+'" onclick="selectDash(\''+c.id+'\')">';
  h+='<div class="ni-icon">'+(c.icon||'📊')+'</div>';
  h+='<div class="ni-txt"><div class="ni-name">'+esc(c.name)+'</div><div class="ni-cat">'+(c.cat?esc(c.cat):'Tanpa kategori')+'</div></div>';
  h+='<div class="ni-actions" onclick="event.stopPropagation()">';
  h+='<button class="mini-btn" title="Edit" onclick="editCard(\''+c.id+'\')">✏️</button>';
  h+='<button class="mini-btn del" title="Hapus" onclick="delCard(\''+c.id+'\')">🗑️</button>';
  h+='</div></div>';
  return h;
}
function updateStats(){
  document.getElementById('statTotal').textContent=cards.length;
  document.getElementById('statCat').textContent=getCats().length;
}

// ============ PREVIEW ============
function selectDash(id){
  let c=cards.find(x=>x.id===id); if(!c) return;
  activeId=id;
  if(!c.url){ alert('Dashboard ini belum ada URL-nya. Klik ✏️ untuk menambahkan.'); return; }
  document.getElementById('pvWelcome').style.display='none';
  let f=document.getElementById('previewFrame');
  f.style.display='block'; f.src=c.url;
  document.getElementById('previewBar').style.display='flex';
  document.getElementById('pvIcon').textContent=c.icon||'📊';
  document.getElementById('pvIcon').style.background=c.soft||'#e6f0fa';
  document.getElementById('pvName').textContent=c.name;
  document.getElementById('pvUrl').textContent=c.url;
  renderList();
  hideSidebar(); // auto-hide setelah pilih dashboard (kecuali di-pin)
}
function reloadPreview(){
  let c=cards.find(x=>x.id===activeId); if(!c) return;
  document.getElementById('previewFrame').src=c.url;
}
function openFull(){
  let c=cards.find(x=>x.id===activeId); if(c&&c.url) window.open(c.url,'_blank');
}

// ============ MODAL ============
function buildPickers(){
  let ih=''; ICONS.forEach(ic=>{ ih+='<div class="icon-opt'+(ic===selIcon?' sel':'')+'" onclick="pickIcon(\''+ic+'\')">'+ic+'</div>'; });
  document.getElementById('iconPicker').innerHTML=ih;
  let ch=''; COLORS.forEach(col=>{ ch+='<div class="color-opt'+(col.c===selColor.c?' sel':'')+'" style="background:'+col.c+'" onclick="pickColor(\''+col.c+'\',\''+col.s+'\')"></div>'; });
  document.getElementById('colorPicker').innerHTML=ch;
  let dl=''; getCats().forEach(c=>dl+='<option value="'+esc(c)+'">');
  document.getElementById('catList').innerHTML=dl;
}
function pickIcon(ic){ selIcon=ic; buildPickers(); }
function pickColor(c,s){ selColor={c:c,s:s}; buildPickers(); }
function openModal(){
  document.getElementById('modalTitle').textContent='Tambah Dashboard';
  document.getElementById('editId').value='';
  document.getElementById('fName').value='';
  document.getElementById('fUrl').value='';
  document.getElementById('fDesc').value='';
  document.getElementById('fCat').value='';
  selIcon=ICONS[0]; selColor=COLORS[0]; buildPickers();
  document.getElementById('modalBg').classList.add('show');
}
function editCard(id){
  let c=cards.find(x=>x.id===id); if(!c) return;
  document.getElementById('modalTitle').textContent='Edit Dashboard';
  document.getElementById('editId').value=c.id;
  document.getElementById('fName').value=c.name||'';
  document.getElementById('fUrl').value=c.url||'';
  document.getElementById('fDesc').value=c.desc||'';
  document.getElementById('fCat').value=c.cat||'';
  selIcon=c.icon||ICONS[0]; selColor={c:c.color||COLORS[0].c,s:c.soft||COLORS[0].s}; buildPickers();
  document.getElementById('modalBg').classList.add('show');
}
function closeModal(){ document.getElementById('modalBg').classList.remove('show'); }
function saveCard(){
  let name=document.getElementById('fName').value.trim();
  let url=document.getElementById('fUrl').value.trim();
  if(!name){ alert('Nama dashboard wajib diisi.'); return; }
  if(!url){ alert('Link / URL wajib diisi.'); return; }
  if(!/^https?:\/\//i.test(url)) url='https://'+url;
  let desc=document.getElementById('fDesc').value.trim();
  let cat=document.getElementById('fCat').value.trim();
  let id=document.getElementById('editId').value;
  if(id){
    let c=cards.find(x=>x.id===id);
    Object.assign(c,{name,url,desc,cat,icon:selIcon,color:selColor.c,soft:selColor.s});
    if(activeId===id) selectDash(id);
  } else {
    let nc={id:uid(),name,url,desc,cat,icon:selIcon,color:selColor.c,soft:selColor.s};
    cards.push(nc);
  }
  persist(); closeModal(); renderList();
}
function delCard(id){
  let c=cards.find(x=>x.id===id);
  if(confirm('Hapus dashboard "'+(c?c.name:'')+'" dari hub?\n(Ini hanya menghapus link, dashboard aslinya tetap aman.)')){
    cards=cards.filter(x=>x.id!==id);
    if(activeId===id){ activeId=null;
      document.getElementById('previewFrame').style.display='none';
      document.getElementById('previewFrame').src='about:blank';
      document.getElementById('previewBar').style.display='none';
      document.getElementById('pvWelcome').style.display='flex';
    }
    persist(); renderList();
  }
}

// ============ BACKUP / RESTORE ============
function exportConfig(){
  let blob=new Blob([JSON.stringify(cards,null,2)],{type:'application/json'});
  let a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='monitoring_hub_backup.json';
  a.click();
}
function importConfig(input){
  let f=input.files[0]; if(!f) return;
  let r=new FileReader();
  r.onload=function(e){
    try{
      let data=JSON.parse(e.target.result);
      if(!Array.isArray(data)) throw new Error('format');
      if(confirm('Restore '+data.length+' dashboard? Ini akan mengganti daftar saat ini.')){
        cards=data.map(c=>({id:c.id||uid(),name:c.name||'',url:c.url||'',desc:c.desc||'',cat:c.cat||'',icon:c.icon||'📊',color:c.color||'#0066B1',soft:c.soft||'#e6f0fa'}));
        activeId=null; persist(); renderList();
        document.getElementById('previewFrame').style.display='none';
        document.getElementById('previewBar').style.display='none';
        document.getElementById('pvWelcome').style.display='flex';
        alert('✅ Berhasil restore '+cards.length+' dashboard.');
      }
    }catch(err){ alert('❌ File tidak valid. Pastikan file backup dari Monitoring Hub.'); }
    input.value='';
  };
  r.readAsText(f);
}

// close modal on outside click / Esc
document.getElementById('modalBg').addEventListener('click',function(e){ if(e.target===this) closeModal(); });
document.addEventListener('keydown',function(e){ if(e.key==='Escape') closeModal(); });

// ============ SIDEBAR AUTO-HIDE ============
let sidebarPinned = false;
let hideTimer = null;

function showSidebar(){
  clearTimeout(hideTimer);
  document.getElementById('sidebar').classList.remove('hidden');
  document.getElementById('edgeHandle').classList.remove('show');
}
function hideSidebar(){
  if(sidebarPinned) return;            // kalau di-pin, jangan sembunyi
  document.getElementById('sidebar').classList.add('hidden');
  document.getElementById('edgeHandle').classList.add('show');
}
function onSidebarLeave(){
  // sembunyikan otomatis saat kursor keluar dari menu (kalau tidak di-pin & sudah ada preview aktif)
  if(sidebarPinned || !activeId) return;
  clearTimeout(hideTimer);
  hideTimer = setTimeout(hideSidebar, 350);
}
function togglePin(){
  sidebarPinned = !sidebarPinned;
  var b=document.getElementById('pinBtn');
  b.classList.toggle('pinned', sidebarPinned);
  b.title = sidebarPinned ? 'Menu terkunci — klik untuk lepas' : 'Kunci menu tetap terbuka';
  if(sidebarPinned){ showSidebar(); }
  localStorage.setItem('hub_pinned', sidebarPinned ? '1':'0');
}
// restore status pin
if(localStorage.getItem('hub_pinned')==='1'){
  sidebarPinned=true;
  document.getElementById('pinBtn').classList.add('pinned');
}

// ============ INIT ============
renderList();
</script>
